{{- /* Reuse existing credentials during Helm upgrades. Argo CD preserves data via ignoreDifferences. */ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "spring-boot-api-secret") | default dict -}}
{{- $data := get $existing "data" | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: spring-boot-api-secret
type: Opaque
data:
  API_KEY: {{ get $data "API_KEY" | default (randAlphaNum 32 | b64enc) | quote }}