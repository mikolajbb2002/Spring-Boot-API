apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-api
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: spring-boot-api
  template:
    metadata:
      labels:
        app: spring-boot-api
    spec:
      containers:
        - name: spring-boot-api
          image: "{{ .Values.image }}:{{ .Values.tag }}"
          command: 
            - sh
            - -c 
            - |
              for port in 8080 8081 8082; do
                (
                  while true; do
                    printf 'HTTP/1.1 200 OK\r\nContent-Length: 2\r\nConnection: close\r\n\r\nOK' |
                      nc -l -p "$port"
                  done
                ) &
              done
              wait
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
          - containerPort: 8080
          - containerPort: 8081
          - containerPort: 8082
          volumeMounts:
          - name: config
            mountPath: "/app/config"
            readOnly: true
      volumes:
      - name: config
        configMap:
          name: spring-boot-api-config
