apiVersion: v1
kind: Pod
metadata:
  name: "spring-boost-api"
  labels:
    {{- include "app_chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "app_chart.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
